version: 2

sources:
  - name: casino_gaming_resort
    database: jack_lowery
    schema: casino_summit_test
    description: >
      Synthetic casino & gaming resort data from the summit_2026_connector_sdk
      Fivetran connector -- 20 joinable tables rooted at `properties`.
    tables:
      - name: properties
        description: Casino resort properties -- the root entity every other table traces back to.
      - name: departments
        description: Operating divisions within a property (gaming ops, security, F&B, etc.).
      - name: employees
        description: Staff, linked to a department and property; self-referential via manager_employee_id.
      - name: gaming_floors
        description: Physical casino floors within a property.
      - name: game_tables
        description: Table games (blackjack, roulette, baccarat, etc.) on a gaming floor.
      - name: slot_machines
        description: Slot machines on a gaming floor.
      - name: players
        description: Patrons/guests.
      - name: loyalty_accounts
        description: Player loyalty program enrollment and point balances.
      - name: cash_cages
        description: Cashier cages within a property.
      - name: hotel_rooms
        description: Hotel rooms within a property.
      - name: fb_outlets
        description: Food & beverage outlets (restaurants, bars) within a property.
      - name: shows
        description: Entertainment shows/events within a property.
      - name: gaming_sessions
        description: A player's session at a game table or slot machine, staffed by an employee.
      - name: wagers
        description: Individual bets placed within a gaming session.
      - name: chip_transactions
        description: Cage transactions (buy-in, cash-out, marker draw/payment, chip exchange).
      - name: comps
        description: Complimentary offers (room, food, show, cash back, free play) issued to players.
      - name: reservations
        description: Hotel room reservations booked by players.
      - name: fb_orders
        description: Orders placed at food & beverage outlets.
      - name: show_tickets
        description: Tickets purchased/comped for shows.
      - name: surveillance_incidents
        description: Incidents logged on a gaming floor, optionally tied to a specific table or machine.
