version: 2

sources:
  - name: level_up_labs
    database: summit_hol_2026
    schema: summit_level_up
    description: >
      Synthetic Level Up Labs video game studio data from the
      summit_2026_connector_sdk Fivetran connector -- 11 joinable tables
      covering the studio's title/platform/SKU catalog and player activity.
    tables:
      - name: titles
        description: The studio's portfolio of games -- the root entity every activity table traces back to.
      - name: platforms
        description: Storefronts a title can ship on (Steam, PlayStation, Xbox, Switch, iOS, Android).
      - name: title_platforms
        description: Bridge between titles and platforms, one row per title/platform release.
      - name: skus
        description: Purchasable items (cosmetics, currency packs, expansions, battle passes) per title.
      - name: releases
        description: Patch/content-drop history per title.
      - name: players
        description: Player accounts.
      - name: play_sessions
        description: A player's session with a title on a given platform.
      - name: transactions
        description: Player purchases -- premium unit sales, IAP, season passes, DLC, refunds, chargebacks.
      - name: high_scores
        description: Leaderboard submissions.
      - name: reviews
        description: Player-submitted store reviews.
      - name: marketing_spend
        description: Weekly acquisition campaign spend and funnel metrics per title/channel.
