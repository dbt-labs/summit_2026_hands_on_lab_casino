version: 2

models:
  - name: dim_players
    description: >
      Player dimension at one row per player. Loyalty metrics roll up all
      accounts, while latest-loyalty fields come from the most recently enrolled
      account with loyalty_id used as a deterministic tie-breaker.
    columns:
      - name: player_id
        description: Primary key for the player dimension.
        data_tests:
          - unique
          - not_null
      - name: loyalty_account_count
        description: Number of loyalty accounts associated with the player.
      - name: total_points_balance
        description: Sum of current point balances across all loyalty accounts.
      - name: total_lifetime_points
        description: Sum of lifetime points across all loyalty accounts.
      - name: latest_loyalty_id
        description: Most recently enrolled loyalty account for the player.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_casino__loyalty_accounts')
                field: loyalty_id
      - name: latest_loyalty_tier
        description: Tier on the most recently enrolled loyalty account.

  - name: fct_wagers
    description: >
      Wager fact at one row per wager, enriched with session and player context.
      Wager and session currencies remain separate because the source contains
      legitimate mismatches; monetary measures must group by wager_currency_code.
    columns:
      - name: wager_id
        description: Primary key for the wager fact.
        data_tests:
          - unique
          - not_null
      - name: session_id
        description: Gaming session in which the wager occurred.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_casino__gaming_sessions')
                field: session_id
      - name: player_id
        description: Player associated with the gaming session.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: player_id
      - name: session_type
        description: Whether the session used a table game or slot machine.
      - name: player_net_winnings
        description: Payout minus wager amount in wager_currency_code.
      - name: gross_gaming_revenue
        description: Wager amount minus payout in wager_currency_code.
      - name: wager_currency_code
        description: Currency for all monetary measures on the wager row.
      - name: session_currency_code
        description: >
          Currency recorded on the parent session; it can differ from the wager
          currency and must not be used for wager measure aggregation.
